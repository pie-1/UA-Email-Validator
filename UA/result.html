<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Validation Result</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeInUp {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-100 to-blue-50 flex items-center justify-center min-h-screen px-4">
    <div
        class="bg-white shadow-xl p-10 rounded-2xl w-full max-w-md animate-fadeInUp border border-blue-100 text-center">
        <h2 class="text-3xl font-extrabold mb-6 text-gray-800">📩 Validation Result</h2>
        <p id="emailResult" class="text-xl font-medium"></p>
        <a href="index.html"
            class="mt-6 inline-block bg-blue-700 text-white px-6 py-3 rounded-lg hover:bg-blue-800 transition">
            🔁 Validate Another Email
        </a>
    </div>

    <script>
        const email = localStorage.getItem("validatedEmail");
        const status = localStorage.getItem("validationStatus");

        const result = document.getElementById("emailResult");

        if (!email || !status) {
            result.textContent = "❌ No validation result found.";
            result.classList.add("text-red-600");
        } else {
            const label = status === "valid" ? "✅ Valid" : "❌ Invalid";
            result.innerHTML = `The email <span class="font-semibold text-gray-800">"${email}"</span> is <span class="${status === 'valid' ? 'text-green-600' : 'text-red-600'}">${label}</span>.`;
        }
    </script>
</body>

</html>
