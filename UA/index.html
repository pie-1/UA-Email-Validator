<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Email Validator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeInUp {
            animation: fadeInUp 0.6s ease-out both;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-100 to-white min-h-screen flex flex-col">


    <header class="bg-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-center items-center">
            <h1 class="text-2xl font-bold text-blue-800">Universal Email Validator</h1>
        </div>
    </header>


    <main class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="bg-white shadow-xl p-8 md:p-10 rounded-2xl w-full max-w-md animate-fadeInUp border border-blue-100">
            <h2 class="text-2xl font-extrabold mb-6 text-center text-gray-800">Login to Validate Email</h2>

            <form id="emailForm" class="space-y-5">
                <div>
                    <label for="name" class="block mb-1 font-semibold text-gray-700">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Full Name"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-700 focus:border-blue-700 placeholder-gray-400"
                        required />
                </div>

                <div>
                    <label for="email" class="block mb-1 font-semibold text-gray-700">Email</label>
                    <input type="text" id="email" name="email" placeholder="example@domain.com"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-700 focus:border-blue-700 placeholder-gray-400"
                        required />
                </div>

                <div>
                    <label for="password" class="block mb-1 font-semibold text-gray-700">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-700 focus:border-blue-700 placeholder-gray-400"
                        required />
                </div>

                <button type="submit"
                    class="w-full bg-blue-700 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-800 transition transform hover:scale-105 duration-200">
                    Validate Email
                </button>
            </form>

            <p id="validationHint" class="mt-4 text-center text-sm font-semibold transition"></p>
        </div>
    </main>


    <footer id="contact" class="bg-white border-t border-blue-100 py-6">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-600">
            <p class="mb-4 font-semibold text-blue-700">Connect with me</p>
            <div class="flex justify-center space-x-6 text-xl">
                <a href="https://github.com/pie-1" target="_blank" class="text-gray-600 hover:text-blue-800">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://linkedin.com/in/yourusername" target="_blank"
                    class="text-gray-600 hover:text-blue-800">
                    <i class="fab fa-linkedin"></i>
                </a>

                <a href="nepali07pawan@gmail.com" class="text-gray-600 hover:text-blue-800">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
            <p class="mt-4 text-sm">&copy; 2025 Universal Email Validator. All rights reserved.</p>
        </div>
    </footer>



    <script src="script.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/punycode/2.3.1/punycode.js"
        integrity="sha512-yIxRBg+triSRDRItZeINUw58keNQxToni/rGa4XhykuXaBLUfHKNKz3AEVDr2WUABXgRO0SwIeqeN83jP3wReQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>


</body>

</html>
